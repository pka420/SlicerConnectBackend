<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Email Verification — SlicerConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f3;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border: 0.5px solid rgba(0,0,0,0.12);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    .icon-ring {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-ring.success { background: #E1F5EE; }
    .icon-ring.error   { background: #FCEBEB; }
    .icon-ring.loading { background: #f0f0ee; }
    .icon-ring svg { width: 32px; height: 32px; }

    h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 1.6rem;
      margin-bottom: 0.6rem;
      color: #1a1a18;
    }

    .sub {
      font-size: 0.92rem;
      color: #666;
      line-height: 1.6;
      font-weight: 300;
      margin-bottom: 1.75rem;
    }

    .step-box {
      background: #f5f5f3;
      border-radius: 10px;
      padding: 1rem 1.25rem;
      text-align: left;
    }
    .step-box-label {
      font-size: 0.72rem;
      color: #999;
      font-weight: 500;
      letter-spacing: 0.08em;
      margin-bottom: 0.6rem;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
    }
    .step-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #1D9E75;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .step span {
      font-size: 0.85rem;
      color: #1a1a18;
    }

    .error-hint {
      font-size: 0.8rem;
      color: #888;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 0.5px solid rgba(0,0,0,0.1);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2.5px solid #e0e0e0;
      border-top-color: #1D9E75;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-color-scheme: dark) {
      body { background: #1a1a18; }
      .card { background: #242422; border-color: rgba(255,255,255,0.1); }
      h2 { color: #f0f0ee; }
      .sub { color: #aaa; }
      .step-box { background: #2e2e2c; }
      .step span { color: #e0e0de; }
      .step-box-label { color: #777; }
      .error-hint { color: #777; border-top-color: rgba(255,255,255,0.08); }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div class="icon-ring loading" id="icon-ring">
      <div class="spinner"></div>
    </div>
    <h2 id="title">Verifying your email…</h2>
    <p class="sub" id="subtitle">Please wait a moment.</p>
    <div id="body-content"></div>
  </div>

  <script>
    const API = '__FRONTEND_URL__';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    function showSuccess() {
      document.getElementById('icon-ring').className = 'icon-ring success';
      document.getElementById('icon-ring').innerHTML = `
        <svg viewBox="0 0 32 32" fill="none" stroke="#0F6E56" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="16" cy="16" r="13"/>
          <path d="M10 16l4 4 8-8"/>
        </svg>`;
      document.getElementById('title').textContent = 'Email verified';
      document.getElementById('subtitle').textContent = 'Your account is ready. Open the SlicerConnect extension in 3D Slicer to log in and get started.';
      document.getElementById('body-content').innerHTML = `
        <div class="step-box">
          <div class="step-box-label">NEXT STEPS</div>
          <div class="step"><div class="step-num">1</div><span>Open 3D Slicer on your machine</span></div>
          <div class="step"><div class="step-num">2</div><span>Go to <strong>Extensions → SlicerConnect</strong></span></div>
          <div class="step"><div class="step-num">3</div><span>Log in with your credentials</span></div>
        </div>`;
    }

    function showError(message) {
      document.getElementById('icon-ring').className = 'icon-ring error';
      document.getElementById('icon-ring').innerHTML = `
        <svg viewBox="0 0 32 32" fill="none" stroke="#A32D2D" stroke-width="2.5" stroke-linecap="round">
          <circle cx="16" cy="16" r="13"/>
          <path d="M16 10v7M16 21v1"/>
        </svg>`;
      document.getElementById('title').textContent = 'Verification failed';
      document.getElementById('subtitle').textContent = message || 'This link may have expired or already been used.';
      document.getElementById('body-content').innerHTML = `
        <div class="error-hint">
          Request a new verification email from inside the SlicerConnect extension, or re-register your account.
        </div>`;
    }

    if (!token) {
      showError('No verification token found in the link.');
    } else {
      fetch(`${API}/auth/verify-email?token=${encodeURIComponent(token)}`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            showSuccess();
          } else {
            showError(data.detail || data.message || null);
          }
        })
        .catch(() => {
          showError('Could not reach the server. Please try again later.');
        });
    }
  </script>
</body>
</html>
